name: Quality gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      # Do not hide the known glib finding. This gate stays red until reviewed/resolved.
      - run: cargo audit --file src-tauri/Cargo.lock --deny unsound
  secrets:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm --network none -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
      - run: docker run --rm --network none -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact --no-banner
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev zlib1g-dev bison flex
      - if: runner.os == 'macOS'
        run: brew install openssl@3
      - if: runner.os == 'Windows'
        id: msys
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make bison flex tar mingw-w64-x86_64-toolchain mingw-w64-x86_64-openssl mingw-w64-x86_64-zlib
      - run: npm ci
      - run: npm run desktop:prepare
        env:
          OPALINE_MINGW_PREFIX: ${{ steps.msys.outputs.msys2-location }}/mingw64
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run tauri build
        env:
          OPALINE_MINGW_PREFIX: ${{ steps.msys.outputs.msys2-location }}/mingw64
  postgres:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: opaline_test
        ports: ["5432/tcp"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
        env:
          OPALINE_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib session_tests -- --ignored --test-threads=1
        env:
          OPALINE_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib database::table_changes -- --ignored --test-threads=1
        env:
          OPALINE_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
  bundled-backup:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev zlib1g-dev bison flex
      - run: npm ci
      - run: npm run desktop:prepare
      - run: node scripts/test-bundled-postgres.mjs
