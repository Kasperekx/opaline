name: Quality gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  VITE_BUILD_SHA: ${{ github.sha }}
jobs:
  rust-security:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: node --test scripts/audit-rust-target.test.mjs
      # macOS is the first beta scope. Linux findings are still printed, not ignored.
      - run: node scripts/audit-rust-target.mjs ${{ matrix.target }}
  secrets:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm --network none -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
      - run: docker run --rm --network none -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact --no-banner
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: brew install openssl@3
      - run: npm ci
      - run: npm run desktop:prepare
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run tauri build
      - run: node scripts/describe-macos-artifact.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: opaline-unsigned-${{ matrix.os }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/build-info.json
          if-no-files-found: error
          retention-days: 7
  postgres:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: opaline_test
        ports: ["5432/tcp"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
        env:
          OPALINE_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib session_tests -- --ignored --test-threads=1
        env:
          OPALINE_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib database::table_changes -- --ignored --test-threads=1
        env:
          OPALINE_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
  bundled-backup:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev zlib1g-dev bison flex
      - run: npm ci
      - run: npm run desktop:prepare
      - run: node scripts/test-bundled-postgres.mjs
