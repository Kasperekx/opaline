name: Workflow improvement
description: Describe a task that is difficult or missing
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow and what gets in the way, without private data.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would make it easier?
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
